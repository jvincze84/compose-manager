<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{APP_SHORT_NAME}}">
  <title>{{APP_NAME}}</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>{{APP_NAME}}</h1>
    <div class="topbar-actions">
      <span id="updated" class="muted"></span>
      <button id="refresh" class="icon-btn" title="Frissítés" aria-label="Frissítés">⟳</button>
    </div>
  </header>

  <div class="filter">
    <input id="search" type="search" placeholder="Keresés…" autocomplete="off">
    <div id="chips" class="chips" role="tablist"></div>
    <div class="list-tools">
      <button id="expand-all" class="small-btn" disabled>▾ Mind kinyit</button>
      <button id="collapse-all" class="small-btn" disabled>▴ Mind becsuk</button>
    </div>
  </div>

  <main id="projects" class="projects">
    <p class="muted center">Betöltés…</p>
  </main>

  <!-- Log nézet -->
  <section id="logview" class="logview hidden" aria-hidden="true">
    <header class="logbar">
      <button id="log-close" class="icon-btn" aria-label="Bezárás">←</button>
      <div class="logtitle">
        <strong id="log-project"></strong>
        <select id="log-service"><option value="">összes service</option></select>
      </div>
      <select id="log-tail" title="Sorok száma">
        <option>100</option><option selected>200</option><option>500</option><option>2000</option>
      </select>
    </header>
    <pre id="log-output" class="logoutput"></pre>
    <footer class="logfoot">
      <label><input type="checkbox" id="log-follow" checked> Követés</label>
      <label><input type="checkbox" id="log-wrap" checked> Tördelés</label>
      <span id="log-state" class="muted"></span>
      <button id="log-bottom" class="small-btn">↓ Alja</button>
    </footer>
  </section>

  <!-- Szerkesztő (docker-compose-*.yaml / .env-*) -->
  <section id="editor" class="logview editor hidden" aria-hidden="true">
    <header class="logbar">
      <button id="ed-close" class="icon-btn" aria-label="Bezárás">←</button>
      <div class="logtitle">
        <strong id="ed-project"></strong>
        <select id="ed-file" title="Fájl"></select>
      </div>
      <button id="ed-history" class="icon-btn" title="Korábbi változatok (backup)" aria-label="Korábbi változatok">🕘</button>
      <button id="ed-save" class="small-btn save-btn" disabled>Mentés</button>
    </header>
    <div id="ed-backups" class="backups hidden">
      <div class="backups-head">
        <strong>Korábbi változatok</strong>
        <span id="ed-backups-info" class="muted"></span>
        <button class="outbox-btn" id="ed-backups-close" aria-label="Bezárás">✕</button>
      </div>
      <div id="ed-backups-list" class="backups-list"></div>
    </div>
    <div id="ed-code" class="code">
      <div class="code-gutter-wrap" aria-hidden="true"><div class="code-gutter"></div></div>
      <div class="code-body">
        <pre class="code-hl" aria-hidden="true"></pre>
        <textarea id="ed-text" class="code-input" spellcheck="false" autocapitalize="off"
          autocomplete="off" autocorrect="off"></textarea>
      </div>
    </div>
    <div id="ed-output" class="outbox ed-output hidden">
      <div class="outbox-head">
        <span class="outbox-title"></span>
        <button class="outbox-btn" data-out="toggle" title="Összecsuk / kinyit" aria-label="Összecsuk">▾</button>
        <button class="outbox-btn" data-out="close" title="Bezárás" aria-label="Bezárás">✕</button>
      </div>
      <pre class="outbox-body"></pre>
    </div>
    <footer class="logfoot">
      <span id="ed-state" class="muted"></span>
      <span id="ed-pos" class="muted ed-pos"></span>
      <label><input type="checkbox" id="ed-wrap"> Tördelés</label>
      <span id="ed-path" class="muted ed-path"></span>
      <button id="ed-check" class="small-btn" title="docker compose config -q (mentés nélkül)">✓ Ellenőrzés</button>
      <button id="ed-save-up" class="small-btn">Mentés + Up</button>
    </footer>
  </section>

  <div id="toast" class="toast hidden"></div>

  <script src="editor.js"></script>
  <script src="app.js"></script>
</body>
</html>
